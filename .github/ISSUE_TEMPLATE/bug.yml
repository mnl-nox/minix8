name: Relatar bug
description: Reporte um comportamento inesperado com passos reproduzíveis.
title: "bug: "
labels: ["type: bug", "status: needs-triage"]
body:
  - type: input
    id: version
    attributes:
      label: Versão e plataforma
      description: Informe tag/commit, SO, arquitetura e compilador.
      placeholder: "v1.0.0, Debian 13 x86_64, GCC 14"
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Passos para reproduzir
      placeholder: Inclua comando e ROM mínima, se aplicável.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Esperado e observado
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Saída completa
      render: text
