name: Project website

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assemble static website
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            PROJECT_VERSION="${GITHUB_REF_NAME#v}"
          else
            PROJECT_VERSION="$(sed -n 's/^project(MiniX8 VERSION \([^ ]*\).*/\1/p' CMakeLists.txt)"
          fi
          mkdir -p _site/docs
          cp site/index.html site/styles.css site/retro.css site/app.js site/logo.svg _site/
          sed -e "s|__REPOSITORY__|${REPOSITORY}|g" -e "s|__VERSION__|${PROJECT_VERSION}|g" site/config.js > _site/config.js
          cp docs/*.md _site/docs/
          cp README.md SECURITY.md SECURITY_AUDIT.md _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
